name: Test Angular Sample App

on:
  pull_request:
    paths:
      - angular-sample-app/**
  push:
    paths:
      - angular-sample-app/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⎔ Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: 📥 Download deps
        run: |
          cd angular-sample-app
          npm i

      - name: Run build
        run: |
          cd angular-sample-app
          npm run build
